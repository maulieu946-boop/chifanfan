<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地中海饮食分析器</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --ocean-blue: #0077BE;
      --olive-green: #7C9873;
      --warm-terra: #D4A574;
      --deep-navy: #1A3A52;
      --soft-cream: #F9F6F1;
      --text-dark: #2C3E50;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #F9F6F1 0%, #E8DED0 100%);
      min-height: 100vh;
      padding: 1.5rem;
      color: var(--text-dark);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeInDown 0.6s ease;
    }

    h1 {
      font-family: 'Crimson Pro', serif;
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--deep-navy);
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--olive-green);
      font-size: 1rem;
      font-weight: 500;
    }

    .upload-section {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 10px 40px var(--shadow);
      margin-bottom: 2rem;
      animation: fadeInUp 0.6s ease 0.2s both;
    }

    .upload-area {
      border: 3px dashed var(--olive-green);
      border-radius: 16px;
      padding: 2.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: var(--soft-cream);
    }

    .upload-area:hover {
      border-color: var(--ocean-blue);
      background: white;
      transform: translateY(-2px);
    }

    .upload-area.dragging {
      border-color: var(--ocean-blue);
      background: #E3F2FD;
    }

    .upload-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .upload-text {
      font-size: 1.1rem;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }

    .upload-hint {
      font-size: 0.9rem;
      color: #7f8c8d;
    }

    input[type="file"] {
      display: none;
    }

    .preview-section {
      margin-top: 1.5rem;
      display: none;
    }

    .preview-section.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    .preview-image {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 1rem;
    }

    .analyze-btn {
      width: 100%;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, var(--ocean-blue), var(--olive-green));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'DM Sans', sans-serif;
    }

    .analyze-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 119, 190, 0.3);
    }

    .analyze-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .results-section {
      display: none;
    }

    .results-section.active {
      display: block;
      animation: fadeInUp 0.6s ease;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 20px var(--shadow);
    }

    .card h2 {
      font-family: 'Crimson Pro', serif;
      font-size: 1.6rem;
      color: var(--deep-navy);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dishes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }

    .dish-item {
      background: var(--soft-cream);
      padding: 1rem;
      border-radius: 12px;
      border-left: 4px solid var(--olive-green);
    }

    .dish-name {
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 0.3rem;
      font-size: 0.95rem;
    }

    .dish-price {
      color: var(--warm-terra);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .dish-category {
      font-size: 0.8rem;
      color: #7f8c8d;
      margin-top: 0.3rem;
    }

    .recommendation {
      background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
      padding: 1.2rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      border-left: 5px solid var(--olive-green);
    }

    .recommendation h3 {
      color: var(--deep-navy);
      margin-bottom: 0.8rem;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .recommendation-score {
      color: #F39C12;
      font-size: 1.2rem;
    }

    .recommendation-dishes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }

    .recommendation-tag {
      background: white;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .recommendation-reason {
      color: var(--text-dark);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .missing-elements {
      background: #FFF3E0;
      padding: 1.2rem;
      border-radius: 12px;
      border-left: 5px solid var(--warm-terra);
    }

    .missing-elements h3 {
      color: var(--deep-navy);
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .missing-list {
      list-style: none;
      margin-bottom: 1rem;
    }

    .missing-list li {
      padding: 0.5rem 0;
      border-bottom: 1px solid #FFE0B2;
      font-size: 0.9rem;
    }

    .missing-list li:last-child {
      border-bottom: none;
    }

    .suggestion {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      font-style: italic;
      color: var(--text-dark);
      font-size: 0.9rem;
    }

    .error-message {
      background: #FFEBEE;
      color: #C62828;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      border-left: 4px solid #C62828;
      font-size: 0.9rem;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      h1 {
        font-size: 2rem;
      }

      .upload-section {
        padding: 1.5rem;
      }

      .upload-area {
        padding: 2rem;
      }

      .card {
        padding: 1.2rem;
      }

      .dishes-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🫒 地中海饮食分析器</h1>
      <p class="subtitle">AI智能分析菜单，提供健康饮食建议</p>
    </header>

    <div class="upload-section">
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📸</div>
        <p class="upload-text">点击或拖拽上传菜单图片</p>
        <p class="upload-hint">支持 JPG、PNG 格式</p>
      </div>
      <input type="file" id="fileInput" accept="image/*">

      <div class="preview-section" id="previewSection">
        <img id="previewImage" class="preview-image" alt="预览">
        <button class="analyze-btn" id="analyzeBtn">🔍 开始AI分析</button>
      </div>
    </div>

    <div class="results-section" id="resultsSection">
      <div class="card">
        <h2>🍽️ 识别到的菜品</h2>
        <div class="dishes-grid" id="dishesGrid"></div>
      </div>

      <div class="card">
        <h2>💚 健康饮食建议</h2>
        <div id="recommendationContent"></div>
      </div>

      <div class="card">
        <h2>⚠️ 营养缺失提醒</h2>
        <div id="missingContent"></div>
      </div>
    </div>
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const previewImage = document.getElementById('previewImage');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultsSection = document.getElementById('resultsSection');

    let selectedFile = null;

    uploadArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', handleFileSelect);

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragging');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragging');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragging');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        handleFile(file);
      }
    });

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) handleFile(file);
    }

    function handleFile(file) {
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImage.src = e.target.result;
        previewSection.classList.add('active');
        resultsSection.classList.remove('active');
      };
      reader.readAsDataURL(file);
    }

    analyzeBtn.addEventListener('click', analyzeDishes);

    async function analyzeDishes() {
      if (!selectedFile) return;

      analyzeBtn.disabled = true;
      analyzeBtn.textContent = '⏳ AI分析中...';

      const oldError = previewSection.querySelector('.error-message');
      if (oldError) oldError.remove();

      try {
        const base64 = await fileToBase64(selectedFile);
        const base64Data = base64.split(',')[1];

        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            messages: [{
              role: 'user',
              content: [
                {
                  type: 'image',
                  source: {
                    type: 'base64',
                    media_type: selectedFile.type,
                    data: base64Data
                  }
                },
                {
                  type: 'text',
                  text: `请分析这张菜单图片，并以严格的JSON格式返回结果（只返回纯JSON，不要任何其他文字）：

{
  "dishes": [{"name": "菜名", "price": "价格", "category": "蔬菜/蛋白质/主食/其他"}],
  "recommendations": [
    {
      "combo": ["菜品1", "菜品2"],
      "score": 5,
      "reason": "简短推荐理由"
    }
  ],
  "missing": {
    "elements": ["缺失元素1", "缺失元素2"],
    "suggestions": "简短补充建议"
  }
}

要求：
1. 只返回JSON，不要markdown标记
2. 文字简洁，不超过50字
3. 至少给出2个推荐方案

分类：蔬菜、蛋白质、主食、其他
评分：5分最佳（蔬菜+鱼/豆+主食），1分最差
缺失参考：全谷物、橄榄油、坚果、深海鱼、豆类、水果`
                }
              ]
            }]
          })
        });

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message || 'API调用失败');
        }

        const text = data.content[0].text;
        console.log('AI响应:', text);
        
        let cleanText = text.trim().replace(/```json\n?|\n?```/g, '').trim();
        const jsonMatch = cleanText.match(/\{[\s\S]*\}/);
        
        if (!jsonMatch) {
          throw new Error('无法解析AI返回的数据');
        }
        
        const result = JSON.parse(jsonMatch[0]);
        displayResults(result);
        resultsSection.classList.add('active');
        
        setTimeout(() => {
          resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);

      } catch (error) {
        console.error('分析失败:', error);
        
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-message';
        errorDiv.innerHTML = `
          <strong>❌ 分析失败</strong><br>
          ${error.message}<br>
          <small>请检查网络连接后重试</small>
        `;
        previewSection.appendChild(errorDiv);
        
        setTimeout(() => errorDiv.remove(), 5000);
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = '🔄 重新分析';
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function displayResults(result) {
      const dishesGrid = document.getElementById('dishesGrid');
      dishesGrid.innerHTML = result.dishes.map(dish => `
        <div class="dish-item">
          <div class="dish-name">${dish.name}</div>
          <div class="dish-price">¥${dish.price}</div>
          <div class="dish-category">${dish.category}</div>
        </div>
      `).join('');

      const recommendationContent = document.getElementById('recommendationContent');
      recommendationContent.innerHTML = result.recommendations.map((rec, idx) => `
        <div class="recommendation">
          <h3>
            <span>推荐方案 ${idx + 1}</span>
            <span class="recommendation-score">${'★'.repeat(rec.score)}${'☆'.repeat(5-rec.score)}</span>
          </h3>
          <div class="recommendation-dishes">
            ${rec.combo.map(dish => `<span class="recommendation-tag">${dish}</span>`).join('')}
          </div>
          <p class="recommendation-reason">${rec.reason}</p>
        </div>
      `).join('');

      const missingContent = document.getElementById('missingContent');
      missingContent.innerHTML = `
        <div class="missing-elements">
          <h3>❌ 菜单中缺少的健康元素：</h3>
          <ul class="missing-list">
            ${result.missing.elements.map(el => `<li>• ${el}</li>`).join('')}
          </ul>
          <div class="suggestion">
            <strong>💡 补充建议：</strong> ${result.missing.suggestions}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
